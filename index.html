<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090D16">
  <title>ドローダウン監視</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #090D16;
      color: #F8FAFC;
      margin: 0;
      padding: 0;
    }
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input[type=checkbox] {
      accent-color: #2563EB;
      width: 1.1rem;
      height: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen pb-16 antialiased">
  <div class="max-w-md mx-auto px-3.5 pt-4 space-y-3.5">

    <!-- 1. ミニマルヘッダー -->
    <header class="flex items-center justify-between pb-2.5 border-b border-slate-800/80">
      <div class="flex items-center gap-1.5">
        <span class="text-xl">📉</span>
        <h1 class="text-base font-bold text-white tracking-tight">ドローダウン監視</h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[11px] font-mono text-slate-400">11/07 18:15 更新</span>
        <button onclick="location.reload()" class="p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 active:scale-95 transition" title="更新">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>
    </header>

    <!-- 2. 2タブ切り替え -->
    <div class="grid grid-cols-2 gap-1 p-1 bg-slate-900 border border-slate-800 rounded-xl text-xs font-bold">
      <button id="tab-btn-portfolio" onclick="switchTab('portfolio')" class="py-2 rounded-lg bg-blue-600 text-white transition flex items-center justify-center gap-1">
        <span>💼</span> マイ資産全体
      </button>
      <button id="tab-btn-stocks" onclick="switchTab('stocks')" class="py-2 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1">
        <span>📊</span> <span id="tab-stocks-label">指数一覧</span>
      </button>
    </div>

    <!-- ============================================================== -->
    <!-- タブA: マイ資産全体 -->
    <!-- ============================================================== -->
    <div id="tab-content-portfolio" class="space-y-3">

      <!-- 巨大下落率メインカード -->
      <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl text-center space-y-2">
        <div class="text-[11px] text-slate-400 font-medium">あなたの株式資産全体の下落率（ATH基準）</div>
        
        <div id="pf-total-drawdown" class="text-5xl font-black font-mono tracking-tight my-1 text-emerald-400">
          --%
        </div>

        <div>
          <span id="pf-status-badge" class="inline-block text-[11px] px-3 py-0.5 rounded-full font-semibold">
            計算中
          </span>
        </div>

        <!-- 進捗バー -->
        <div class="space-y-1 mt-3 text-left">
          <div class="flex justify-between text-[10px] font-mono text-slate-400">
            <span>ATH(0%)</span>
            <span>-15%</span>
            <span>-30%</span>
            <span>-45%+</span>
          </div>
          <div class="w-full bg-slate-950 rounded-full h-2.5 p-0.5 overflow-hidden flex relative border border-slate-800">
            <div class="absolute left-[33.3%] top-0 bottom-0 w-0.5 bg-slate-700/80 z-10"></div>
            <div class="absolute left-[66.6%] top-0 bottom-0 w-0.5 bg-slate-700/80 z-10"></div>
            <div id="pf-progress-bar" class="h-full rounded-full transition-all duration-300 bg-blue-500" style="width: 0%"></div>
          </div>
          <div id="pf-next-hint" class="text-[11px] text-slate-300 font-medium pt-0.5 text-center font-mono">
            計算中...
          </div>
        </div>

        <!-- 保有比率サマリー ＆ 設定ボタン -->
        <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex items-center justify-between text-xs">
          <div id="pf-allocation-summary" class="flex flex-wrap gap-1 font-mono text-[11px]">
            <!-- JSでバッジ生成 -->
          </div>
          <button onclick="togglePortfolioEdit()" class="text-[11px] text-blue-400 hover:text-blue-300 font-semibold shrink-0 ml-1">
            ⚙️ 配分を変更
          </button>
        </div>
      </div>

      <!-- 配分編集エリア（折りたたみ） -->
      <div id="pf-edit-panel" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
        <div class="flex items-center justify-between pb-1.5 border-b border-slate-800">
          <span class="text-xs font-bold text-white flex items-center gap-1">
            <span>⚙️</span> 保有割合の編集
          </span>
          <div class="flex items-center gap-1.5">
            <button onclick="normalizeWeights()" class="text-[10px] bg-slate-800 text-blue-400 px-2 py-0.5 rounded font-medium">
              100%に調整
            </button>
            <button onclick="addPortfolioRow()" class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded font-medium">
              ＋ 追加
            </button>
          </div>
        </div>

        <div id="portfolio-rows-container" class="space-y-2">
          <!-- JSでレンダリング -->
        </div>

        <div class="flex justify-between items-center text-xs text-slate-400 pt-2 border-t border-slate-800">
          <div>合計: <span id="pf-total-weight" class="font-bold font-mono text-white">100%</span></div>
          <button onclick="togglePortfolioEdit()" class="text-xs bg-slate-800 text-slate-200 px-3 py-0.5 rounded font-medium">
            完了
          </button>
        </div>
      </div>

      <!-- ルール目安 -->
      <div class="bg-slate-900/40 border border-slate-800/60 rounded-xl p-3 text-[11px] text-slate-400 space-y-1">
        <div class="font-semibold text-slate-300">💡 買い増し目標の目安</div>
        <div class="grid grid-cols-3 gap-1 pt-1 text-center font-mono text-[10px]">
          <div class="bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
            <span class="text-amber-400 block font-bold">-15%</span>
            調整（第1弾）
          </div>
          <div class="bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
            <span class="text-orange-400 block font-bold">-30%</span>
            暴落（第2弾）
          </div>
          <div class="bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
            <span class="text-rose-400 block font-bold">-45%</span>
            歴史的暴落
          </div>
        </div>
      </div>

    </div>

    <!-- ============================================================== -->
    <!-- タブB: 指数一覧（★選択したものだけ表示可能！） -->
    <!-- ============================================================== -->
    <div id="tab-content-stocks" class="hidden space-y-3">

      <!-- 表示フィルターバー -->
      <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-xl p-2.5">
        <div class="text-xs text-slate-300 font-medium">
          表示中: <strong id="visible-stocks-count" class="text-blue-400 font-mono font-bold">4</strong> 銘柄
        </div>
        <button onclick="toggleStockSelectorModal()" class="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-2.5 py-1 rounded-lg flex items-center gap-1 active:scale-95 transition shadow">
          <span>⚙️</span> <strong>表示する銘柄を選ぶ</strong>
        </button>
      </div>

      <!-- 銘柄選択・チェックボックスパネル（折りたたみモーダル風） -->
      <div id="stock-selector-panel" class="hidden bg-slate-900 border-2 border-blue-500/40 rounded-2xl p-3.5 space-y-3 shadow-2xl">
        <div class="flex items-center justify-between pb-2 border-b border-slate-800">
          <div>
            <div class="text-xs font-bold text-white flex items-center gap-1">
              <span>⭐</span> 表示したい銘柄にチェック（✔）
            </div>
            <div class="text-[10px] text-slate-400 mt-0.5">見たい銘柄だけを残してスッキリ整理できます</div>
          </div>
          <button onclick="toggleStockSelectorModal()" class="text-xs bg-blue-600 text-white font-bold px-3 py-1 rounded-lg">
            完了
          </button>
        </div>

        <!-- クイック選択プリセットボタン -->
        <div class="flex flex-wrap gap-1.5 text-[11px] pt-0.5">
          <button onclick="selectPreset('main')" class="bg-slate-800 hover:bg-slate-700 text-blue-300 px-2 py-0.5 rounded border border-slate-700">
            主要4銘柄のみ
          </button>
          <button onclick="selectPreset('portfolio')" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 px-2 py-0.5 rounded border border-slate-700">
            マイ資産の銘柄のみ
          </button>
          <button onclick="selectPreset('all')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700">
            全選択 (24)
          </button>
          <button onclick="selectPreset('clear')" class="bg-slate-800 hover:bg-slate-700 text-rose-300 px-2 py-0.5 rounded border border-slate-700">
            選択クリア
          </button>
        </div>

        <!-- チェックボックス一覧（カテゴリ別） -->
        <div id="stock-checkbox-list" class="space-y-2.5 max-h-72 overflow-y-auto pr-1 text-xs">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <!-- 選択された銘柄カード一覧 -->
      <div id="all-stocks-list" class="space-y-2.5">
        <!-- JSでレンダリング -->
      </div>

    </div>

  </div>

  <script>

egory": "ハイテク・グロース", "current_price": 136.53, "ath": 218.51, "ath_date": "2026-06-22", "drawdown_pct": 37.52, "drop_amount": 81.98, "currency": "USD", "updated_at": "2026-11-07 18:14:57"}, {"ticker": "SMH", "name": "半導体株 (VanEck 半導体ETF)", "category": "ハイテク・グロース", "current_price": 463.96, "ath": 671.83, "ath_date": "2026-06-22", "drawdown_pct": 30.94, "drop_amount": 207.87, "currency": "USD", "updated_at": "2026-11-07 18:14:57"}, {"ticker": "VYM", "name": "米国高配当株 (バンガード VYM)", "category": "配当・バリュー", "current_price": 159.08, "ath": 166.68, "ath_date": "2026-08-13", "drawdown_pct": 4.56, "drop_amount": 7.6, "currency": "USD", "updated_at": "2026-11-07 18:14:57"}, {"ticker": "HDV", "name": "米国高配当株 (iShares HDV)", "category": "配当・バリュー", "current_price": 30.35, "ath": 31.43, "ath_date": "2026-11-05", "drawdown_pct": 3.44, "drop_amount": 1.08, "currency": "USD", "updated_at": "2026-11-07 18:14:57"}, {"ticker": "SPYD", "name": "SPYD (S&P500 高配当ETF)", "category": "配当・バリュー", "current_price": 49.41, "ath": 51.1, "ath_date": "2026-11-05", "drawdown_pct": 3.32, "drop_amount": 1.69, "currency": "USD", "updated_at": "2026-11-07 18:14:58"}, {"ticker": "EPI", "name": "インド株 (WisdomTree India)", "category": "新興国", "current_price": 43.44, "ath": 50.86, "ath_date": "2024-09-26", "drawdown_pct": 14.58, "drop_amount": 7.42, "currency": "USD", "updated_at": "2026-11-07 18:14:58"}, {"ticker": "VWO", "name": "新興国株 (バンガード VWO)", "category": "新興国", "current_price": 55.29, "ath": 61.42, "ath_date": "2026-09-04", "drawdown_pct": 9.98, "drop_amount": 6.13, "currency": "USD", "updated_at": "2026-11-07 18:14:58"}, {"ticker": "QLD", "name": "レバナス (ProShares Ultra QQQ 2倍)", "category": "レバレッジ", "current_price": 74.11, "ath": 101.62, "ath_date": "2026-10-06", "drawdown_pct": 27.07, "drop_amount": 27.51, "currency": "USD", "updated_at": "2026-11-07 18:14:58"}, {"ticker": "TQQQ", "name": "TQQQ (ProShares UltraPro QQQ 3倍)", "category": "レバレッジ", "current_price": 52.25, "ath": 87.72, "ath_date": "2026-06-03", "drawdown_pct": 40.43, "drop_amount": 35.47, "currency": "USD", "updated_at": "2026-11-07 18:14:58"}, {"ticker": "NVDA", "name": "エヌビディア (NVIDIA)", "category": "個別株", "current_price": 186.64, "ath": 243.37, "ath_date": "2026-10-06", "drawdown_pct": 23.31, "drop_amount": 56.73, "currency": "USD", "updated_at": "2026-11-07 18:14:59"}, {"ticker": "AAPL", "name": "アップル (Apple)", "category": "個別株", "current_price": 342.37, "ath": 355.38, "ath_date": "2026-11-05", "drawdown_pct": 3.66, "drop_amount": 13.01, "currency": "USD", "updated_at": "2026-11-07 18:15:00"}, {"ticker": "MSFT", "name": "マイクロソフト (Microsoft)", "category": "個別株", "current_price": 530.61, "ath": 559.15, "ath_date": "2026-11-04", "drawdown_pct": 5.1, "drop_amount": 28.54, "currency": "USD", "updated_at": "2026-11-07 18:15:00"}, {"ticker": "AMZN", "name": "アマゾン (Amazon)", "category": "個別株", "current_price": 259.3, "ath": 287.2, "ath_date": "2026-08-03", "drawdown_pct": 9.71, "drop_amount": 27.9, "currency": "USD", "updated_at": "2026-11-07 18:14:59"}, {"ticker": "GOOGL", "name": "アルファベット / Google", "category": "個別株", "current_price": 284.78, "ath": 408.1, "ath_date": "2026-05-18", "drawdown_pct": 30.22, "drop_amount": 123.32, "currency": "USD", "updated_at": "2026-11-07 18:14:59"}, {"ticker": "META", "name": "メタ (Meta)", "category": "個別株", "current_price": 610.15, "ath": 793.02, "ath_date": "2025-08-15", "drawdown_pct": 23.06, "drop_amount": 182.87, "currency": "USD", "updated_at": "2026-11-07 18:14:59"}, {"ticker": "TSLA", "name": "テスラ (Tesla)", "category": "個別株", "current_price": 358.22, "ath": 498.83, "ath_date": "2025-12-22", "drawdown_pct": 28.19, "drop_amount": 140.61, "currency": "USD", "updated_at": "2026-11-07 18:15:00"}];

    let userPortfolio = [
      { ticker: "ACWI", weight: 70 },
      { ticker: "FNGS", weight: 30 }
    ];

    let customThresholds = {};

    // ★ 選択した銘柄リスト（デフォルト: 主要4銘柄のみに初期化！）
    let visibleTickers = ["ACWI", "QQQ", "FNGS", "VOO"];

    try {
      const savedPf = localStorage.getItem("user_drawdown_portfolio");
      if (savedPf) userPortfolio = JSON.parse(savedPf);

      const savedTh = localStorage.getItem("user_custom_thresholds");
      if (savedTh) customThresholds = JSON.parse(savedTh);

      const savedVisible = localStorage.getItem("user_visible_tickers_list");
      if (savedVisible) {
        const parsed = JSON.parse(savedVisible);
        if (Array.isArray(parsed) && parsed.length > 0) {
          visibleTickers = parsed;
        }
      }
    } catch(e) {}

    function saveVisibleTickers() {
      try {
        localStorage.setItem("user_visible_tickers_list", JSON.stringify(visibleTickers));
      } catch(e) {}
    }

    function getThresholds(ticker) {
      return customThresholds[ticker] || [15, 30, 45];
    }

    function updateSingleThreshold(ticker, index, value) {
      const val = parseFloat(value);
      if (isNaN(val) || val <= 0 || val >= 100) return;
      if (!customThresholds[ticker]) customThresholds[ticker] = [15, 30, 45];
      customThresholds[ticker][index] = val;
      try {
        localStorage.setItem("user_custom_thresholds", JSON.stringify(customThresholds));
      } catch(e) {}
      renderSelectedStocksList();
    }

    function resetSingleThresholds(ticker) {
      if (customThresholds[ticker]) {
        delete customThresholds[ticker];
        try {
          localStorage.setItem("user_custom_thresholds", JSON.stringify(customThresholds));
        } catch(e) {}
      }
      renderSelectedStocksList();
    }

    // タブ切り替え
    let currentTab = "portfolio";
    function switchTab(tab) {
      currentTab = tab;
      const btnPf = document.getElementById("tab-btn-portfolio");
      const btnSt = document.getElementById("tab-btn-stocks");
      const cntPf = document.getElementById("tab-content-portfolio");
      const cntSt = document.getElementById("tab-content-stocks");

      if (tab === "portfolio") {
        btnPf.className = "py-2 rounded-lg bg-blue-600 text-white transition flex items-center justify-center gap-1";
        btnSt.className = "py-2 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1";
        cntPf.classList.remove("hidden");
        cntSt.classList.add("hidden");
      } else {
        btnSt.className = "py-2 rounded-lg bg-blue-600 text-white transition flex items-center justify-center gap-1";
        btnPf.className = "py-2 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-1";
        cntSt.classList.remove("hidden");
        cntPf.classList.add("hidden");
      }
    }

    function togglePortfolioEdit() {
      document.getElementById("pf-edit-panel").classList.toggle("hidden");
    }

    function toggleStockSelectorModal() {
      const p = document.getElementById("stock-selector-panel");
      p.classList.toggle("hidden");
      if (!p.classList.contains("hidden")) {
        renderCheckboxList();
      }
    }

    // ==============================================================
    // 銘柄選択・チェックボックス機能
    // ==============================================================
    function renderCheckboxList() {
      const container = document.getElementById("stock-checkbox-list");
      container.innerHTML = "";

      const categories = [...new Set(STOCKS.map(s => s.category))];
      categories.forEach(cat => {
        const catBox = document.createElement("div");
        catBox.className = "space-y-1";

        const title = document.createElement("div");
        title.className = "text-[10px] font-bold text-slate-400 uppercase tracking-wider pt-1 border-t border-slate-800/80";
        title.textContent = cat;
        catBox.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "grid grid-cols-2 gap-1.5";

        STOCKS.filter(s => s.category === cat).forEach(s => {
          const isChecked = visibleTickers.includes(s.ticker);
          const label = document.createElement("label");
          label.className = `flex items-center gap-2 p-1.5 rounded-lg border transition cursor-pointer ${isChecked ? 'bg-blue-950/40 border-blue-500/40 text-white' : 'bg-slate-950 border-slate-800 text-slate-400'}`;
          label.innerHTML = `
            <input type="checkbox" value="${s.ticker}" ${isChecked ? 'checked' : ''} onchange="toggleTickerVisibility('${s.ticker}', this.checked)">
            <span class="truncate font-semibold text-xs">${s.name.split(' ')[0]} <span class="font-mono text-[10px] text-slate-500">(${s.ticker})</span></span>
          `;
          grid.appendChild(label);
        });

        catBox.appendChild(grid);
        container.appendChild(catBox);
      });
    }

    function toggleTickerVisibility(ticker, isChecked) {
      if (isChecked) {
        if (!visibleTickers.includes(ticker)) visibleTickers.push(ticker);
      } else {
        if (visibleTickers.length <= 1) {
          alert("最低1つの銘柄を選択してください。");
          renderCheckboxList();
          return;
        }
        visibleTickers = visibleTickers.filter(t => t !== ticker);
      }
      saveVisibleTickers();
      renderSelectedStocksList();
      renderCheckboxList();
    }

    function selectPreset(type) {
      if (type === "main") {
        visibleTickers = ["ACWI", "QQQ", "FNGS", "VOO"];
      } else if (type === "portfolio") {
        visibleTickers = userPortfolio.map(p => p.ticker);
      } else if (type === "all") {
        visibleTickers = STOCKS.map(s => s.ticker);
      } else if (type === "clear") {
        visibleTickers = ["ACWI"];
      }
      saveVisibleTickers();
      renderSelectedStocksList();
      renderCheckboxList();
    }

    // ==============================================================
    // ポートフォリオ計算
    // ==============================================================
    function calculatePortfolioTotal() {
      const totalWeight = userPortfolio.reduce((acc, curr) => acc + curr.weight, 0);
      document.getElementById("pf-total-weight").textContent = `${totalWeight}%`;
      document.getElementById("pf-total-weight").className = `font-bold font-mono ${totalWeight === 100 ? 'text-emerald-400' : 'text-amber-400'}`;

      const summaryElem = document.getElementById("pf-allocation-summary");
      summaryElem.innerHTML = userPortfolio.map(p => {
        const s = STOCKS.find(item => item.ticker === p.ticker);
        const name = s ? s.ticker : p.ticker;
        return `<span class="bg-slate-800 border border-slate-700/80 text-slate-300 px-1.5 py-0.5 rounded">${name} <strong class="text-white">${p.weight}%</strong></span>`;
      }).join("");

      if (totalWeight === 0) return;

      let weightedDrawdown = 0;
      userPortfolio.forEach(item => {
        const s = STOCKS.find(stock => stock.ticker === item.ticker);
        if (s) weightedDrawdown += (item.weight / totalWeight) * s.drawdown_pct;
      });

      const totalDd = weightedDrawdown;
      const ddElem = document.getElementById("pf-total-drawdown");
      const badgeElem = document.getElementById("pf-status-badge");
      const barElem = document.getElementById("pf-progress-bar");
      const hintElem = document.getElementById("pf-next-hint");

      ddElem.textContent = `-${totalDd.toFixed(2)}%`;

      let badgeClass = "bg-emerald-500/10 text-emerald-400 border border-emerald-500/30";
      let barColor = "bg-emerald-500";
      let statusText = "健全な推移（小幅調整）";

      if (totalDd >= 45.0) {
        badgeClass = "bg-rose-500/20 text-rose-400 border border-rose-500/30";
        barColor = "bg-rose-500";
        statusText = "🚨 歴史的大暴落（全力買い場）";
      } else if (totalDd >= 30.0) {
        badgeClass = "bg-orange-500/20 text-orange-400 border border-orange-500/30";
        barColor = "bg-orange-500";
        statusText = "⚡ 本格ベア相場（第2買い増し水準）";
      } else if (totalDd >= 15.0) {
        badgeClass = "bg-amber-500/20 text-amber-400 border border-amber-500/30";
        barColor = "bg-amber-500";
        statusText = "⚠️ 調整局面（第1買い増し圏）";
      }

      ddElem.className = `text-5xl font-black font-mono tracking-tight my-1 ${totalDd >= 30 ? 'text-rose-400' : totalDd >= 15 ? 'text-amber-400' : 'text-emerald-400'}`;
      badgeElem.className = `inline-block text-[11px] px-3 py-0.5 rounded-full font-semibold ${badgeClass}`;
      badgeElem.textContent = statusText;

      const meterWidth = Math.min(100, (totalDd / 45.0) * 100);
      barElem.style.width = `${meterWidth}%`;
      barElem.className = `h-full rounded-full transition-all duration-300 ${barColor}`;

      const lines = [15.0, 30.0, 45.0];
      const nextLine = lines.find(l => l > totalDd);
      if (nextLine) {
        const rem = (nextLine - totalDd).toFixed(2);
        hintElem.innerHTML = `🎯 次の <strong class="text-white">-${nextLine}%</strong> ラインまで あと <strong class="text-amber-400">-${rem}%</strong>`;
      } else {
        hintElem.innerHTML = `🔥 <strong class="text-rose-400">-45%</strong> 以上の歴史的暴落ライン到達中！`;
      }
    }

    function renderPortfolioRows() {
      const container = document.getElementById("portfolio-rows-container");
      container.innerHTML = "";

      userPortfolio.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "bg-slate-950 p-2 rounded-xl border border-slate-800 flex items-center justify-between gap-2";

        let selectHtml = `<select onchange="updatePortfolioTicker(${index}, this.value)" class="bg-slate-900 border border-slate-700 text-white text-xs rounded px-2 py-1 outline-none font-bold flex-1 truncate">`;
        STOCKS.forEach(s => {
          const sel = s.ticker === item.ticker ? "selected" : "";
          selectHtml += `<option value="${s.ticker}" ${sel}>${s.name} (${s.ticker})</option>`;
        });
        selectHtml += `</select>`;

        row.innerHTML = `
          ${selectHtml}
          <div class="flex items-center gap-1 shrink-0">
            <input type="number" min="0" max="100" value="${item.weight}" oninput="updatePortfolioWeight(${index}, this.value)" class="w-11 bg-slate-900 border border-slate-700 text-white font-mono font-bold text-xs rounded px-1 py-1 text-center outline-none">
            <span class="text-xs text-slate-400 font-mono">%</span>
            <button onclick="removePortfolioRow(${index})" class="text-slate-500 hover:text-rose-400 px-1 text-sm">✕</button>
          </div>
        `;
        container.appendChild(row);
      });

      try {
        localStorage.setItem("user_drawdown_portfolio", JSON.stringify(userPortfolio));
      } catch(e) {}
    }

    function updatePortfolioTicker(index, newTicker) {
      userPortfolio[index].ticker = newTicker;
      renderPortfolioRows();
      calculatePortfolioTotal();
    }

    function updatePortfolioWeight(index, newWeight) {
      userPortfolio[index].weight = parseFloat(newWeight) || 0;
      calculatePortfolioTotal();
      try {
        localStorage.setItem("user_drawdown_portfolio", JSON.stringify(userPortfolio));
      } catch(e) {}
    }

    function addPortfolioRow() {
      const usedTickers = userPortfolio.map(p => p.ticker);
      const nextStock = STOCKS.find(s => !usedTickers.includes(s.ticker)) || STOCKS[0];
      userPortfolio.push({ ticker: nextStock.ticker, weight: 10 });
      renderPortfolioRows();
      calculatePortfolioTotal();
    }

    function removePortfolioRow(index) {
      if (userPortfolio.length <= 1) return;
      userPortfolio.splice(index, 1);
      renderPortfolioRows();
      calculatePortfolioTotal();
    }

    function normalizeWeights() {
      const sum = userPortfolio.reduce((acc, curr) => acc + curr.weight, 0);
      if (sum === 0) return;
      userPortfolio.forEach(item => item.weight = Math.round((item.weight / sum) * 100));
      const newSum = userPortfolio.reduce((acc, curr) => acc + curr.weight, 0);
      if (newSum !== 100 && userPortfolio.length > 0) userPortfolio[0].weight += (100 - newSum);
      renderPortfolioRows();
      calculatePortfolioTotal();
    }

    // ==============================================================
    // ★ 選択した銘柄だけのスッキリ一覧表示
    // ==============================================================
    let openSettingsTicker = null;

    function toggleStockSettings(ticker) {
      openSettingsTicker = openSettingsTicker === ticker ? null : ticker;
      renderSelectedStocksList();
    }

    function renderSelectedStocksList() {
      const container = document.getElementById("all-stocks-list");
      container.innerHTML = "";

      // 選択されている銘柄だけにフィルタリング！
      const filtered = STOCKS.filter(s => visibleTickers.includes(s.ticker));

      // カウントバッジとタブのラベルを更新
      document.getElementById("visible-stocks-count").textContent = filtered.length;
      document.getElementById("tab-stocks-label").textContent = `指数一覧 (${filtered.length})`;

      filtered.forEach(s => {
        const dd = s.drawdown_pct;
        const ths = getThresholds(s.ticker);
        const th1 = ths[0] ?? 15;
        const th2 = ths[1] ?? 30;
        const th3 = ths[2] ?? 45;

        const p1 = (s.ath * (1 - th1 / 100)).toFixed(2);
        const p2 = (s.ath * (1 - th2 / 100)).toFixed(2);
        const p3 = (s.ath * (1 - th3 / 100)).toFixed(2);

        let ddColor = "text-emerald-400";
        let barColor = "bg-emerald-500";
        if (dd >= th3) {
          ddColor = "text-rose-400";
          barColor = "bg-rose-500";
        } else if (dd >= th2) {
          ddColor = "text-orange-400";
          barColor = "bg-orange-500";
        } else if (dd >= th1) {
          ddColor = "text-amber-400";
          barColor = "bg-amber-500";
        }

        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-800/90 rounded-2xl p-3.5 shadow-md space-y-2";

        const isSettingsOpen = openSettingsTicker === s.ticker;

        card.innerHTML = `
          <!-- 上段: 銘柄情報と下落率 -->
          <div class="flex items-start justify-between">
            <div class="pr-2">
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${s.ticker}</span>
                <span class="text-[10px] text-slate-400">${s.category}</span>
              </div>
              <h3 class="text-sm font-bold text-white tracking-tight leading-snug">${s.name}</h3>
              <div class="text-[11px] text-slate-400 font-mono mt-0.5">
                現在: <strong class="text-slate-200">$${s.current_price.toFixed(2)}</strong>
                <span class="text-slate-500 ml-1">ATH: $${s.ath.toFixed(2)}</span>
              </div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-2xl font-black font-mono ${ddColor} tracking-tight">-${s.drawdown_pct.toFixed(2)}%</div>
              <div class="text-[10px] text-rose-400/90 font-mono">-$${s.drop_amount.toFixed(2)}</div>
            </div>
          </div>

          <!-- 中段: プログレスバー -->
          <div class="w-full bg-slate-950 rounded-full h-1.5 overflow-hidden flex relative border border-slate-800">
            <div class="absolute left-[33.3%] top-0 bottom-0 w-0.5 bg-slate-700/80 z-10"></div>
            <div class="absolute left-[66.6%] top-0 bottom-0 w-0.5 bg-slate-700/80 z-10"></div>
            <div class="${barColor} h-full rounded-full" style="width: ${Math.min(100, (dd / 45) * 100)}%"></div>
          </div>

          <!-- 下段: 3等分グリッド -->
          <div class="pt-1.5 border-t border-slate-800/80">
            <div class="grid grid-cols-3 gap-1.5 text-center font-mono">
              <div class="bg-slate-950/80 p-1 rounded-lg border ${dd >= th1 ? 'border-amber-500/50 bg-amber-500/10' : 'border-slate-800/80'}">
                <span class="text-[10px] text-amber-400 block font-bold">-${th1}%</span>
                <span class="text-xs font-bold text-white">$${p1}</span>
              </div>
              <div class="bg-slate-950/80 p-1 rounded-lg border ${dd >= th2 ? 'border-orange-500/50 bg-orange-500/10' : 'border-slate-800/80'}">
                <span class="text-[10px] text-orange-400 block font-bold">-${th2}%</span>
                <span class="text-xs font-bold text-white">$${p2}</span>
              </div>
              <div class="bg-slate-950/80 p-1 rounded-lg border ${dd >= th3 ? 'border-rose-500/50 bg-rose-500/10' : 'border-slate-800/80'}">
                <span class="text-[10px] text-rose-400 block font-bold">-${th3}%</span>
                <span class="text-xs font-bold text-white">$${p3}</span>
              </div>
            </div>

            <div class="flex justify-end pt-1">
              <button onclick="toggleStockSettings('${s.ticker}')" class="text-[10px] text-blue-400 hover:text-blue-300 font-medium">
                ${isSettingsOpen ? '▲ 設定を閉じる' : '⚙️ 目標%を変更'}
              </button>
            </div>
          </div>

          <!-- 目標値変更エリア（必要な時だけ開く） -->
          ${isSettingsOpen ? `
            <div class="pt-2 border-t border-slate-800 bg-slate-950/90 p-2.5 rounded-xl space-y-2">
              <div class="flex justify-between items-center text-[11px] text-slate-300">
                <span class="font-bold">目標下落率(%)の変更</span>
                <button onclick="resetSingleThresholds('${s.ticker}')" class="text-[10px] text-blue-400">初期値に戻す</button>
              </div>
              <div class="grid grid-cols-3 gap-1.5 text-xs font-mono">
                <div>
                  <span class="text-[10px] text-amber-400 block mb-0.5">第1目標</span>
                  <div class="flex items-center bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5">
                    <span>-</span>
                    <input type="number" value="${th1}" onchange="updateSingleThreshold('${s.ticker}', 0, this.value)" class="w-full bg-transparent text-white font-bold text-center outline-none">
                    <span>%</span>
                  </div>
                </div>
                <div>
                  <span class="text-[10px] text-orange-400 block mb-0.5">第2目標</span>
                  <div class="flex items-center bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5">
                    <span>-</span>
                    <input type="number" value="${th2}" onchange="updateSingleThreshold('${s.ticker}', 1, this.value)" class="w-full bg-transparent text-white font-bold text-center outline-none">
                    <span>%</span>
                  </div>
                </div>
                <div>
                  <span class="text-[10px] text-rose-400 block mb-0.5">第3目標</span>
                  <div class="flex items-center bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5">
                    <span>-</span>
                    <input type="number" value="${th3}" onchange="updateSingleThreshold('${s.ticker}', 2, this.value)" class="w-full bg-transparent text-white font-bold text-center outline-none">
                    <span>%</span>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderPortfolioRows();
      calculatePortfolioTotal();
      renderSelectedStocksList();
    });
  </script>
</body>
</html>
